services:
  - type: web
    name: soberwatch-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      # Add your secrets in Render Dashboard > Environment (never commit them):
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: VITE_FIREBASE_API_KEY
      #   sync: false
