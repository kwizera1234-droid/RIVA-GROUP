services:
  - type: web
    name: soberwatch
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build:server && (npm run build:client || echo "[build] client build failed; server bundle is still available")
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      # Add your secrets in Render Dashboard > Environment (never commit them):
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: VITE_FIREBASE_API_KEY
      #   sync: false
